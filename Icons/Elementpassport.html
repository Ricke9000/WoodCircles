<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Property Panel</title>

    <link href="./css/trimblepassport.css" rel="stylesheet" />

    <style>
      body {
        background: #e8e8ec;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 2rem;
        font-family: sans-serif;
      }
      .panel-wrapper {
        width: 19rem;
        background: #fff;
        border-radius: 0.12rem;
        box-shadow:
          0 0 0.06rem rgba(54, 53, 69, 0.2),
          0.12rem 0.12rem 0.5rem rgba(54, 53, 69, 0.3);
        display: flex;
        flex-direction: column;
        height: 90vh;
        overflow: hidden;
        position: relative;
      }
      .trimble-workspace-details-content {
        bottom: 0;
        display: flex;
        flex-direction: column;
        height: 100%;
        left: 0;
        overflow-y: auto;
        position: absolute;
        right: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <div class="trimble-workspace">
      <div class="panel-wrapper">
        <div class="trimble-workspace-details-content" data-cy="property-panel">
          <!-- TOOLBAR -->
          <div class="pset-toolbar-area">
            <div class="title-row">
              <div class="title">
                <span id="passport-id" class="h3">Element</span>
              </div>
            </div>
          </div>

          <!-- PANEL MIDDLE -->
          <div class="pset-panel-middle" data-cy="pset-panel-middle">
            <!-- Collapse-all toolbar row -->
            <section class="pset-collapse-all-group pset-skip_next_separator">
              <div class="pset-separator"></div>
              <section class="pset-favorite-or-not-text">
                <span class="h6 text-muted">Properties</span>
              </section>
            </section>

            <div class="pset-separator"></div>
          </div>
          <!-- end pset-panel-middle -->
        </div>
        <!-- end trimble-workspace-details-content -->
      </div>
      <!-- end panel-wrapper -->
    </div>
    <!-- end trimble-workspace -->
    <script src="./js/TrimbleDemonstrator.js" type="text/javascript"></script>
  </body>
</html>
